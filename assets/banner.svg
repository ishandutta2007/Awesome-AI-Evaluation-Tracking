<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0e172a"/>
      <stop offset="100%" stop-color="#170f2f"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85"/>
    </linearGradient>

    <linearGradient id="flow-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="orb-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="50" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.35; }
      50% { transform: scale(1.15) translate(30px, -20px); opacity: 0.6; }
    }
    @keyframes pulseOrb2 {
      0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.3; }
      50% { transform: scale(1.2) translate(-25px, 20px); opacity: 0.55; }
    }
    @keyframes flowDash {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes pingDot {
      0% { r: 3; opacity: 1; }
      50% { r: 7; opacity: 0.4; }
      100% { r: 3; opacity: 1; }
    }
    @keyframes subtleFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    .orb-anim1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 250px 100px; }
    .orb-anim2 { animation: pulseOrb2 10s ease-in-out infinite; transform-origin: 950px 250px; }
    .flow-path { stroke-dasharray: 12, 12; animation: flowDash 15s linear infinite; }
    .node-ping { animation: pingDot 3s ease-in-out infinite; }
    .pill-float { animation: subtleFloat 5s ease-in-out infinite; }
    .text-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .text-desc {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
    }
    .text-mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-weight: 600;
      font-size: 12px;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)"/>

  <!-- Subtle Animated Orbs in Background -->
  <g filter="url(#orb-blur)">
    <circle cx="240" cy="100" r="140" fill="#38bdf8" class="orb-anim1" />
    <circle cx="960" cy="240" r="160" fill="#a855f7" class="orb-anim2" />
    <circle cx="600" cy="300" r="100" fill="#6366f1" opacity="0.25" />
  </g>

  <!-- Grid Overlay -->
  <rect width="1200" height="360" rx="16" fill="url(#grid)" />

  <!-- Animated Tracing / Evaluation Graph Lines in Background -->
  <g opacity="0.6">
    <path class="flow-path" d="M 50 180 Q 300 60, 600 180 T 1150 180" fill="none" stroke="url(#flow-line)" stroke-width="2.5" />
    <path class="flow-path" d="M 50 240 Q 350 320, 650 200 T 1150 120" fill="none" stroke="url(#flow-line)" stroke-width="2" style="animation-duration: 20s; animation-direction: reverse;" />
  </g>

  <!-- Decorative Telemetry Nodes in Background -->
  <g opacity="0.7">
    <circle cx="300" cy="120" r="4" fill="#38bdf8" class="node-ping" />
    <circle cx="600" cy="180" r="5" fill="#818cf8" class="node-ping" style="animation-delay: 1s;" />
    <circle cx="900" cy="140" r="4" fill="#c084fc" class="node-ping" style="animation-delay: 2s;" />
  </g>

  <!-- Content Layer: Guaranteed foreground prominence with crisp backdrop card -->
  <g id="foreground-content">
    <!-- Center Hero Badge / Pill -->
    <g class="pill-float" transform="translate(425, 42)">
      <rect width="350" height="30" rx="15" fill="url(#badge-grad)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5"/>
      <circle cx="20" cy="15" r="5" fill="#10b981" class="node-ping" />
      <text x="35" y="19" fill="#94a3b8" class="text-mono" font-size="11" letter-spacing="1.5">ENTERPRISE LLMOPS &amp; EVALUATION</text>
    </g>

    <!-- Main Title: Crisp & Bold Gradient -->
    <text x="600" y="135" text-anchor="middle" class="text-title" font-size="44" fill="url(#primary-grad)" filter="url(#glow)">
      Awesome AI Evaluation &amp; Tracking
    </text>

    <!-- Subtitle / Tagline -->
    <text x="600" y="178" text-anchor="middle" class="text-desc" font-size="18" fill="#e2e8f0" font-weight="500">
      The Curated Guide to LLM Observability, Experiment Tracking, RAG Triad Evals &amp; Guardrails
    </text>

    <!-- Bottom Feature Pills / Topics -->
    <g transform="translate(180, 225)">
      <!-- Pill 1: LLM Tracing -->
      <g transform="translate(0, 0)">
        <rect width="190" height="42" rx="10" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="1.2"/>
        <text x="95" y="26" text-anchor="middle" fill="#38bdf8" class="text-desc" font-size="13" font-weight="600">⚡ OTel-Native Tracing</text>
      </g>

      <!-- Pill 2: RAG Evaluation -->
      <g transform="translate(210, 0)">
        <rect width="190" height="42" rx="10" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="1.2"/>
        <text x="95" y="26" text-anchor="middle" fill="#818cf8" class="text-desc" font-size="13" font-weight="600">🎯 RAG Triad &amp; Evals</text>
      </g>

      <!-- Pill 3: Agent Benchmarking -->
      <g transform="translate(420, 0)">
        <rect width="190" height="42" rx="10" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="1.2"/>
        <text x="95" y="26" text-anchor="middle" fill="#a855f7" class="text-desc" font-size="13" font-weight="600">🤖 Agentic Benchmarks</text>
      </g>

      <!-- Pill 4: Guardrails & Red-Teaming -->
      <g transform="translate(630, 0)">
        <rect width="210" height="42" rx="10" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="1.2"/>
        <text x="105" y="26" text-anchor="middle" fill="#f43f5e" class="text-desc" font-size="13" font-weight="600">🛡️ Guardrails &amp; Red Teaming</text>
      </g>
    </g>

    <!-- Footer Stats / Status Bar -->
    <g transform="translate(360, 305)">
      <text x="240" y="0" text-anchor="middle" class="text-desc" font-size="13" fill="#64748b">
        ⭐ Top SaaS Platforms • 📦 Open-Source Frameworks • 🔄 Continuously Updated 2026
      </text>
    </g>
  </g>
</svg>
